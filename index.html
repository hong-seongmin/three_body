<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3체 문제 시뮬레이션</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <div id="canvas-container"></div>

        <div id="control-panel">
            <h2>3체 문제 시뮬레이션</h2>

            <div class="control-section">
                <h3>시뮬레이션 컨트롤</h3>
                <div class="button-group">
                    <button id="play-pause-btn" class="btn-primary">▶ 재생</button>
                    <button id="reset-btn" class="btn-secondary">⟲ 리셋</button>
                </div>
                <div class="control-item">
                    <label>
                        <input type="checkbox" id="trail-toggle" checked>
                        궤적 표시
                    </label>
                </div>
                <div class="control-item">
                    <label>시간 속도: <span id="speed-value">1.0x</span></label>
                    <input type="range" id="time-speed" min="0.1" max="3" step="0.1" value="1">
                </div>
            </div>

            <div class="control-section">
                <h3>물체 1 (빨강)</h3>
                <div class="body-controls" data-body="0">
                    <div class="control-item">
                        <label>질량 (kg): <span class="mass-value">1000</span></label>
                        <input type="range" class="mass-slider" min="100" max="5000" step="100" value="1000">
                    </div>
                    <div class="control-item">
                        <label>크기: <span class="size-value">1.0</span></label>
                        <input type="range" class="size-slider" min="0.5" max="2.5" step="0.1" value="1.0">
                    </div>
                    <div class="control-item">
                        <label>위치 X: <span class="pos-x-value">-50</span></label>
                        <input type="range" class="pos-x-slider" min="-100" max="100" step="5" value="-50">
                    </div>
                    <div class="control-item">
                        <label>위치 Y: <span class="pos-y-value">0</span></label>
                        <input type="range" class="pos-y-slider" min="-100" max="100" step="5" value="0">
                    </div>
                    <div class="control-item">
                        <label>위치 Z: <span class="pos-z-value">0</span></label>
                        <input type="range" class="pos-z-slider" min="-100" max="100" step="5" value="0">
                    </div>
                    <div class="control-item">
                        <label>초기 속도 X: <span class="vel-x-value">0</span></label>
                        <input type="range" class="vel-x-slider" min="-20" max="20" step="1" value="0">
                    </div>
                    <div class="control-item">
                        <label>초기 속도 Y: <span class="vel-y-value">10</span></label>
                        <input type="range" class="vel-y-slider" min="-20" max="20" step="1" value="10">
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>물체 2 (초록)</h3>
                <div class="body-controls" data-body="1">
                    <div class="control-item">
                        <label>질량 (kg): <span class="mass-value">1500</span></label>
                        <input type="range" class="mass-slider" min="100" max="5000" step="100" value="1500">
                    </div>
                    <div class="control-item">
                        <label>크기: <span class="size-value">1.2</span></label>
                        <input type="range" class="size-slider" min="0.5" max="2.5" step="0.1" value="1.2">
                    </div>
                    <div class="control-item">
                        <label>위치 X: <span class="pos-x-value">50</span></label>
                        <input type="range" class="pos-x-slider" min="-100" max="100" step="5" value="50">
                    </div>
                    <div class="control-item">
                        <label>위치 Y: <span class="pos-y-value">0</span></label>
                        <input type="range" class="pos-y-slider" min="-100" max="100" step="5" value="0">
                    </div>
                    <div class="control-item">
                        <label>위치 Z: <span class="pos-z-value">0</span></label>
                        <input type="range" class="pos-z-slider" min="-100" max="100" step="5" value="0">
                    </div>
                    <div class="control-item">
                        <label>초기 속도 X: <span class="vel-x-value">0</span></label>
                        <input type="range" class="vel-x-slider" min="-20" max="20" step="1" value="0">
                    </div>
                    <div class="control-item">
                        <label>초기 속도 Y: <span class="vel-y-value">-5</span></label>
                        <input type="range" class="vel-y-slider" min="-20" max="20" step="1" value="-5">
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>물체 3 (파랑)</h3>
                <div class="body-controls" data-body="2">
                    <div class="control-item">
                        <label>질량 (kg): <span class="mass-value">800</span></label>
                        <input type="range" class="mass-slider" min="100" max="5000" step="100" value="800">
                    </div>
                    <div class="control-item">
                        <label>크기: <span class="size-value">0.8</span></label>
                        <input type="range" class="size-slider" min="0.5" max="2.5" step="0.1" value="0.8">
                    </div>
                    <div class="control-item">
                        <label>위치 X: <span class="pos-x-value">0</span></label>
                        <input type="range" class="pos-x-slider" min="-100" max="100" step="5" value="0">
                    </div>
                    <div class="control-item">
                        <label>위치 Y: <span class="pos-y-value">50</span></label>
                        <input type="range" class="pos-y-slider" min="-100" max="100" step="5" value="50">
                    </div>
                    <div class="control-item">
                        <label>위치 Z: <span class="pos-z-value">0</span></label>
                        <input type="range" class="pos-z-slider" min="-100" max="100" step="5" value="0">
                    </div>
                    <div class="control-item">
                        <label>초기 속도 X: <span class="vel-x-value">8</span></label>
                        <input type="range" class="vel-x-slider" min="-20" max="20" step="1" value="8">
                    </div>
                    <div class="control-item">
                        <label>초기 속도 Y: <span class="vel-y-value">-5</span></label>
                        <input type="range" class="vel-y-slider" min="-20" max="20" step="1" value="-5">
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>사전 설정</h3>
                <button class="btn-secondary" onclick="loadPreset('figure8')">Figure-8 궤도</button>
                <button class="btn-secondary" onclick="loadPreset('lagrange')">라그랑주 삼각형</button>
                <button class="btn-secondary" onclick="loadPreset('chaos')">혼돈 궤도</button>
            </div>

            <div class="info-section">
                <p><strong>조작법:</strong></p>
                <ul>
                    <li>마우스 드래그: 시점 회전</li>
                    <li>휠: 확대/축소</li>
                    <li>우클릭 드래그: 이동</li>
                    <li>물체 클릭 후 드래그: 위치 조정</li>
                </ul>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="physics.js"></script>
    <script src="main.js"></script>
</body>
</html>
